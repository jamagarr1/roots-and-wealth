<style>
/* Layout: one reading column. Home = three quiz tiles; quiz = one question card at a time with a reveal panel. Each quiz has its own color. */
:root{
  --bg:#F5F2EE; --surface:#FFFFFF; --ink:#1E1A17; --muted:#6B625B; --line:#E4DDD5;
  --red:#B23A2E; --green:#2D6A45; --gold:#9A6A0C; --blue:#1F5F8B; --purple:#6B3FA0;
  --good:#2D6A45; --good-soft:#DCEFE3; --bad:#B23A2E; --bad-soft:#F6DEDA;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Source Serif 4",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --accent:var(--red);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141210; --surface:#1F1B18; --ink:#F3EEE8; --muted:#A99F96; --line:#36302B;
  --red:#F07A6B; --green:#6CC892; --gold:#E3B04B; --blue:#7DB8E3; --purple:#C3A3F0;
  --good:#6CC892; --good-soft:#18301F; --bad:#F07A6B; --bad-soft:#3A1D19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141210; --surface:#1F1B18; --ink:#F3EEE8; --muted:#A99F96; --line:#36302B;
  --red:#F07A6B; --green:#6CC892; --gold:#E3B04B; --blue:#7DB8E3; --purple:#C3A3F0;
  --good:#6CC892; --good-soft:#18301F; --bad:#F07A6B; --bad-soft:#3A1D19; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.stripe{display:flex;height:6px;border-radius:3px;overflow:hidden;width:96px}
.stripe i{flex:1}.stripe i:nth-child(1){background:var(--red)}.stripe i:nth-child(2){background:var(--ink)}.stripe i:nth-child(3){background:var(--green)}
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(36px,9vw,56px);line-height:1;margin:10px 0;text-wrap:balance;letter-spacing:-.01em}
.dek{color:var(--muted);margin:0;max-width:54ch}
.tiles{display:grid;gap:12px}
a.tile{display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:18px 18px 18px 16px;transition:transform .15s,border-color .15s}
a.tile:hover{transform:translateX(3px)}
a.tile:focus-visible,.btn:focus-visible,button.choice:focus-visible,.back:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tile h2{font-family:var(--display);font-weight:800;font-size:23px;margin:0;grid-column:1}
.tile p{margin:0;color:var(--muted);font-size:15px;grid-column:1}
.tile .count{grid-column:2;grid-row:1/3;font-family:var(--mono);font-size:13px;color:var(--c);white-space:nowrap}
.best{font-family:var(--mono);font-size:12px;color:var(--muted)}
.back{align-self:flex-start;font-family:var(--mono);font-size:13px;color:var(--muted);text-decoration:none}
.progress{display:flex;gap:5px}
.progress span{flex:1;height:6px;border-radius:3px;background:var(--line);transition:background .25s}
.progress span.right{background:var(--good)}.progress span.wrong{background:var(--bad)}.progress span.now{background:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:16px}
.qnum{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.q{font-family:var(--display);font-weight:500;font-size:clamp(21px,5vw,26px);line-height:1.22;margin:0;text-wrap:balance}
.choices{display:grid;gap:10px}
.choices.tf{grid-template-columns:1fr 1fr}
button.choice{font:inherit;font-size:16px;text-align:left;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:13px 15px;cursor:pointer;transition:border-color .15s,background .15s}
.choices.tf button.choice{text-align:center;font-family:var(--display);font-weight:800;font-size:19px}
button.choice:hover:not(:disabled){border-color:var(--accent)}
button.choice:disabled{cursor:default}
button.choice.correct{background:var(--good-soft);border-color:var(--good)}
button.choice.picked-wrong{background:var(--bad-soft);border-color:var(--bad)}
button.choice.dim{opacity:.55}
.reveal{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:12px;animation:rise .3s ease}
@keyframes rise{from{transform:translateY(6px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.reveal{animation:none}a.tile{transition:none}}
.verdict{font-family:var(--display);font-weight:800;font-size:20px}
.verdict.ok{color:var(--good)}.verdict.no{color:var(--bad)}
.explain{margin:0}
.row{display:flex;flex-wrap:wrap;gap:10px}
.btn{font-family:var(--display);font-weight:800;font-size:17px;background:var(--accent);color:var(--bg);border:0;border-radius:999px;padding:12px 22px;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.score{font-family:var(--display);font-weight:800;font-size:clamp(60px,18vw,96px);line-height:.9;color:var(--accent);font-variant-numeric:tabular-nums}
.score small{font-size:.35em;color:var(--muted)}
.rank{font-family:var(--display);font-weight:800;font-size:clamp(24px,6vw,32px);line-height:1.1;text-wrap:balance}
.note{font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;margin:0}
.topic{display:flex;flex-direction:column;gap:8px}
.older{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-family:var(--mono);font-size:12px;color:var(--muted);padding-left:10px}
.chip{color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px;text-decoration:none}
.chip:hover{border-color:var(--ink)}
.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.copied{font-family:var(--mono);font-size:12px;color:var(--good);align-self:center}
</style>

<script>
const QUIZZES = {
  culture:{title:"The Culture", kicker:"Black culture", color:"--red",
    dek:"Music, books, holidays and institutions that shaped Black American life.",
    note:"",
    qs:[
      {q:"Juneteenth marks the day news of freedom reached enslaved people in which city?", choices:["Charleston, South Carolina","Galveston, Texas","New Orleans, Louisiana","Richmond, Virginia"], a:1,
       ex:"Union troops arrived in Galveston on June 19, 1865, about two and a half years after the Emancipation Proclamation. Juneteenth became a federal holiday in 2021."},
      {q:"Hip-hop is traced to a 1973 back-to-school party thrown by DJ Kool Herc. Which borough was it in?", choices:["Brooklyn","Harlem, Manhattan","Queens","The Bronx"], a:3,
       ex:"The party was in the rec room at 1520 Sedgwick Avenue in the Bronx. Herc's trick of looping the drum break of a record laid the groundwork for the whole culture."},
      {type:"tf", q:"True or false: Hip-hop's four core elements are usually named as DJing, MCing, breaking and graffiti.", a:0,
       ex:"True. Those four took shape together in the Bronx in the 1970s. Many people add a fifth, knowledge, popularized by Afrika Bambaataa and the Universal Zulu Nation."},
      {type:"tf", q:"True or false: Kwanzaa is a religious holiday meant to replace Christmas.", a:1,
       ex:"False. Kwanzaa is a cultural celebration, not a religious one, held December 26 to January 1. People of any faith observe it, and many celebrate Christmas too."},
      {q:"Who wrote the novel Their Eyes Were Watching God?", choices:["Toni Morrison","Alice Walker","Zora Neale Hurston","Nella Larsen"], a:2,
       ex:"Zora Neale Hurston published it in 1937. She was also a trained anthropologist who collected Black folklore across the South and the Caribbean."},
      {q:"\"Lift Every Voice and Sing,\" often called the Black national anthem, was written by whom?", choices:["James Weldon Johnson","Langston Hughes","W.E.B. Du Bois","Paul Laurence Dunbar"], a:0,
       ex:"James Weldon Johnson wrote the words in 1900 and his brother J. Rosamond Johnson set them to music. The NAACP later adopted it as its official song."},
      {q:"How many principles, the Nguzo Saba, does Kwanzaa celebrate?", choices:["Five","Seven","Ten","Twelve"], a:1,
       ex:"Seven, one for each night: unity, self-determination, collective work, cooperative economics, purpose, creativity and faith. Maulana Karenga created the holiday in 1966."},
      {q:"Which is recognized as the oldest historically Black college or university?", choices:["Howard University","Morehouse College","Cheyney University of Pennsylvania","Fisk University"], a:2,
       ex:"Cheyney University was founded in 1837 as the Institute for Colored Youth, decades before most HBCUs opened after the Civil War."},
      {q:"Who created and hosted Soul Train?", choices:["Dick Gregory","Don Cornelius","Berry Gordy","Quincy Jones"], a:1,
       ex:"Don Cornelius launched it in Chicago and took it national in 1971. It ran for 35 years and gave Black artists a national stage TV mostly denied them."},
      {q:"Who was the first Black writer to win a Pulitzer Prize?", choices:["Gwendolyn Brooks","Ralph Ellison","Richard Wright","Langston Hughes"], a:0,
       ex:"Gwendolyn Brooks won the 1950 Pulitzer for poetry for Annie Allen. She later became Poet Laureate of Illinois."}
    ]},
  liberation:{title:"The Struggle", kicker:"Black liberation", color:"--green",
    dek:"Resistance, organizing and the people who pushed freedom forward.",
    note:"",
    qs:[
      {q:"Which country became the first nation founded by formerly enslaved people after a successful revolt?", choices:["Jamaica","Liberia","Haiti","Brazil"], a:2,
       ex:"Haiti declared independence in 1804 after a 13-year revolution against France. It was the only slave revolt in history to found a nation."},
      {q:"Harriet Tubman was widely known by what nickname?", choices:["The General","Moses","The Conductor Queen","Mother Freedom"], a:1,
       ex:"Moses, after the biblical leader who led his people out of bondage. She escaped in 1849 and went back South again and again to guide others out."},
      {q:"Journalist Ida B. Wells is best known for investigating what?", choices:["Lynching","Prison labor","Sharecropping contracts","Voter suppression"], a:0,
       ex:"Lynching. Her reporting showed that the usual excuses for it were false, and she risked her life to publish it. She was also a founding member of the NAACP in 1909."},
      {type:"tf", q:"True or false: The Emancipation Proclamation freed every enslaved person in the United States.", a:1,
       ex:"False. In 1863 it applied only to Confederate states in rebellion, not to slaveholding border states that stayed in the Union. Slavery ended nationwide with the 13th Amendment in December 1865."},
      {type:"tf", q:"True or false: Rosa Parks was the first person arrested in Montgomery for refusing to give up her bus seat.", a:1,
       ex:"False. Nine months earlier, 15-year-old Claudette Colvin was arrested for the same act. Organizers chose Parks, a respected NAACP secretary, as the face of the boycott."},
      {q:"Marcus Garvey's movement launched a shipping company meant to link Black people across the world. What was it called?", choices:["The Freedom Fleet","The Black Star Line","The Ethiopian Navigation Co.","The Pan-African Line"], a:1,
       ex:"The Black Star Line, launched in 1919 by Garvey's Universal Negro Improvement Association. At its peak the UNIA had chapters in dozens of countries."},
      {q:"How long did the Montgomery Bus Boycott last?", choices:["30 days","100 days","381 days","2 years"], a:2,
       ex:"381 days, from December 1955 to December 1956. Black residents walked, carpooled and ran their own ride network until the buses were desegregated."},
      {q:"\"Bloody Sunday\" in 1965 took place on which bridge?", choices:["Edmund Pettus Bridge","Brooklyn Bridge","Arlington Memorial Bridge","Natchez Trace Bridge"], a:0,
       ex:"The Edmund Pettus Bridge in Selma, Alabama, where state troopers attacked marchers led by John Lewis and Hosea Williams. The violence helped push the Voting Rights Act through that August."},
      {q:"Fannie Lou Hamer helped found which group to challenge Mississippi's all-white delegation in 1964?", choices:["SNCC","The Mississippi Freedom Democratic Party","The Southern Christian Leadership Conference","The Congress of Racial Equality"], a:1,
       ex:"The Mississippi Freedom Democratic Party. Her televised testimony at the 1964 Democratic convention about being beaten for trying to register to vote reached millions."},
      {q:"Which Black Panther Party program fed thousands of children every day?", choices:["Free Breakfast for Children","Meals for Freedom","The People's Pantry","Community Lunch Program"], a:0,
       ex:"The Free Breakfast for Children program, started in 1969. It spread to cities nationwide and is often credited with pressuring the federal government to expand school breakfast."}
    ]},
  money:{title:"The Bag", kicker:"Black financial knowledge", color:"--gold",
    dek:"Retirement accounts, credit, investing and Black economic history.",
    note:"For learning, not personal financial advice. Rules and limits change, so check current IRS figures before acting.",
    qs:[
      {q:"What does IRA stand for?", choices:["Investment Return Agreement","Individual Retirement Account","Income Reserve Account","Insured Retirement Annuity"], a:1,
       ex:"Individual Retirement Account. It's a tax-advantaged account you open yourself at a bank or brokerage, separate from any job. You generally need earned income, or a working spouse, to contribute. Roth IRAs also have income limits, so higher earners can't put money in one directly."},
      {q:"What is the main perk of a Roth IRA?", choices:["You get a tax deduction now","Qualified withdrawals in retirement are tax-free","Your money is FDIC insured","There is no limit on contributions"], a:1,
       ex:"You pay tax on the money going in, then qualified withdrawals in retirement are tax-free, growth included. A traditional IRA flips it: possible deduction now, taxes when you withdraw."},
      {type:"tf", q:"True or false: If your job offers a 401(k), you're not allowed to also put money in an IRA.", a:1,
       ex:"False. You can contribute to both. There are limits to know about, though. At higher incomes, having a workplace plan can cut or remove the tax deduction for a traditional IRA, and Roth IRAs have income limits for everyone, with or without a 401(k)."},
      {q:"Your job offers a 401(k) match. What is the usual first move?", choices:["Skip it until debt is paid off","Contribute at least enough to get the full match","Put it all in your employer's stock","Wait until you're 40"], a:1,
       ex:"Get the full match. If your employer matches 50 cents per dollar up to 6% of pay, contributing less leaves part of your compensation on the table."},
      {q:"The Rule of 72 estimates how long it takes money to double. At an 8% yearly return, about how long?", choices:["5 years","9 years","15 years","20 years"], a:1,
       ex:"About 9 years: 72 divided by 8. That's why starting early matters so much. Money invested at 25 has several more doublings ahead than money invested at 45."},
      {q:"What is an index fund?", choices:["A fund that picks a few hot stocks","A savings account tied to inflation","A fund that owns a slice of a whole market index","A government bond"], a:2,
       ex:"It buys all the stocks in an index, like the S&P 500, so you own a small piece of hundreds of companies. Fees tend to be low and you're not betting on any one company."},
      {q:"Common FICO credit scores range from what to what?", choices:["0 to 100","100 to 500","300 to 850","500 to 1,000"], a:2,
       ex:"300 to 850. Paying on time and keeping balances low compared to your limits are the two biggest factors you control."},
      {type:"tf", q:"True or false: Your will decides who gets your IRA when you die.", a:1,
       ex:"False, in most cases. The beneficiary form on the account usually controls, not your will. There are exceptions. A 401(k) generally has to go to your spouse unless they signed a waiver, community property states can give a spouse a share, and if no living beneficiary is named, the money goes through your estate. Check your forms after a marriage, divorce or new child."},
      {q:"Maggie Lena Walker made history in 1903 by doing what?", choices:["Founding the first Black-owned insurance company","Becoming the first woman to charter a U.S. bank","Opening the first Black stock brokerage","Building the first Black-owned department store"], a:1,
       ex:"She chartered St. Luke Penny Savings Bank in Richmond, Virginia, and became the first woman of any race to charter a bank in the U.S. It helped Black families buy homes when other banks wouldn't lend to them."},
      {q:"The prosperous Black district known as \"Black Wall Street\" was in which city?", choices:["Durham, North Carolina","Tulsa, Oklahoma","Atlanta, Georgia","Chicago, Illinois"], a:1,
       ex:"Greenwood in Tulsa, Oklahoma. In 1921 a white mob burned about 35 blocks, killing as many as 300 people and wiping out generations of wealth. Durham's Parrish Street was also called Black Wall Street."},
      {q:"In the Federal Reserve's 2022 survey, about how many times more wealth did the median white household hold than the median Black household?", choices:["About 2 times","About 3 times","About 6 times","About 20 times"], a:2,
       ex:"About 6 times: roughly $285,000 versus $45,000. Much of that gap traces to homeownership and inheritance, which is why retirement accounts and beneficiary planning matter."}
    ]},
  health:{title:"The Checkup", kicker:"Black health", color:"--blue",
    dek:"Myths and must-knows about our food, our bodies and the care Black families get.",
    note:"For learning, not medical advice. Talk with your doctor about your own health.",
    qs:[{"type": "tf", "q": "True or false: Eating tofu and other soy foods will make Black men grow breasts or lose testosterone.", "a": 1, "ex": "False. Clinical studies of men eating normal amounts of soy found no change in testosterone or estrogen. The rare case reports involved extreme intake, like about three quarts of soy milk a day. Tofu is a cheap, solid protein."}, {"q": "Which soul food staple has the most protein per cooked cup?", "choices": ["Collard greens", "Black-eyed peas", "Candied yams", "Cornbread"], "a": 1, "ex": "Black-eyed peas, with about 13 grams per cooked cup. The New Year's Day peas are a protein food in their own right. Red beans, butter beans, lentils and peanuts are other strong plant sources."}, {"type": "tf", "q": "True or false: Red beans and rice have to be eaten in the same bite to give you \"complete\" protein.", "a": 1, "ex": "False. Your body pools amino acids from everything you eat over the day. Beans at lunch and rice at dinner still count. Eating a mix of plant foods covers it."}, {"q": "A 16-ounce glass of Southern sweet tea often has about how much sugar?", "choices": ["Less than 1 teaspoon", "About 2 teaspoons", "6 to 10 teaspoons", "None if it's homemade"], "a": 2, "ex": "Often 6 to 10 teaspoons, depending on how heavy the hand is with the sugar. That can match a can of soda. Half sweet, half unsweet is an easy step down."}, {"q": "Which cookout condiment usually has the most sugar per serving?", "choices": ["Yellow mustard", "Hot sauce", "BBQ sauce", "Pickle relish"], "a": 2, "ex": "BBQ sauce. Many bottled brands have 10 to 16 grams of sugar in just two tablespoons, which is 3 to 4 teaspoons. Mustard and most hot sauces have almost none."}, {"q": "Which of these on an ingredient list is NOT a type of sugar?", "choices": ["Dextrose", "Evaporated cane juice", "Sodium bicarbonate", "High-fructose corn syrup"], "a": 2, "ex": "Sodium bicarbonate is baking soda. Sugar hides under dozens of names in bread, sauces, seasonings and \"savory\" packaged food. Many of those names end in -ose."}, {"type": "tf", "q": "True or false: Smoked turkey is a low-salt way to season your greens.", "a": 1, "ex": "False. Smoked turkey has less fat than a ham hock, but smoked and cured meats are still loaded with sodium. Onion, garlic, vinegar, red pepper flakes and a little smoked paprika add flavor with less salt."}, {"q": "In a large study reported by the American Heart Association, about how many Black adults had high blood pressure by age 55?", "choices": ["1 in 4", "1 in 2", "3 in 4", "9 in 10"], "a": 2, "ex": "About 3 in 4. High blood pressure usually has no symptoms, which is why it's called the silent killer. Getting your numbers checked at a pharmacy or doctor's office is the only way to know."}, {"q": "About how many Black babies in the U.S. are born with sickle cell trait?", "choices": ["1 in 13", "1 in 100", "1 in 500", "1 in 5,000"], "a": 0, "ex": "About 1 in 13, according to the CDC. The trait usually causes no symptoms, so many adults don't know they carry it. If both parents carry it, each child has a 1 in 4 chance of sickle cell disease. A simple blood test tells you."}, {"q": "In 2023, Black women in the U.S. died from pregnancy-related causes at about how many times the rate of white women?", "choices": ["About the same", "About 1.5 times", "About 3 times", "About 10 times"], "a": 2, "ex": "More than 3 times, according to CDC data. Serena Williams had to push her care team to check for blood clots after giving birth in 2017, and she was right. Speaking up and bringing an advocate to appointments can save lives."}, {"q": "Compared with white men, how likely are Black men to die of prostate cancer?", "choices": ["Less likely", "About as likely", "About twice as likely", "About ten times as likely"], "a": 2, "ex": "About twice as likely. The American Cancer Society suggests Black men talk with their doctor about screening starting at age 45, earlier than the general recommendation."}, {"type": "tf", "q": "True or false: Black people don't need to worry about skin cancer.", "a": 1, "ex": "False. Melanoma is less common in Black people, but it's often caught later, when it's harder to treat. It tends to show up on the palms, the soles of the feet or under the nails. Bob Marley died of a melanoma that started under his toenail."}, {"type": "tf", "q": "True or false: Until 2021, a common kidney test automatically scored Black patients' kidneys as healthier just because they were Black.", "a": 0, "ex": "True. The race adjustment made kidney disease look less serious in Black patients, which delayed referrals and transplant listings. Experts dropped it in 2021, and transplant centers now have to restore the wait time Black patients lost."}]},
  spotlight:{title:"The Spotlight", kicker:"Black music & entertainment", color:"--purple", added:"Oct 31",
    dek:"Firsts and one-of-a-kinds in Black music, film and TV.",
    note:"",
    qs:[{"q": "Who was the first Black person to win an Academy Award?", "choices": ["Hattie McDaniel", "Sidney Poitier", "Dorothy Dandridge", "Ethel Waters"], "a": 0, "ex": "Hattie McDaniel won Best Supporting Actress in 1940 for Gone with the Wind. The hotel hosting the ceremony was segregated, and she had to sit at a separate table away from her castmates."}, {"type": "tf", "q": "True or false: Halle Berry is still the only Black woman to win the Oscar for Best Actress.", "a": 0, "ex": "True. She won in 2002 for Monster's Ball, the same night Denzel Washington won Best Actor. Several Black actresses have been nominated since, but none has won."}, {"q": "Which future legend won Amateur Night at the Apollo in 1934 after switching from dancing to singing at the last minute?", "choices": ["Billie Holiday", "Sarah Vaughan", "Etta James", "Ella Fitzgerald"], "a": 3, "ex": "Ella Fitzgerald, at 17. She planned to dance, got nervous after the act before her, and sang instead. She went on to be called the First Lady of Song."}, {"q": "In 1956, who became the first Black performer to host a network TV variety show?", "choices": ["Sammy Davis Jr.", "Harry Belafonte", "Nat King Cole", "Flip Wilson"], "a": 2, "ex": "Nat King Cole, on NBC. Big stars appeared on the show, but it never found a national sponsor and ended after about a year. Cole said Madison Avenue was afraid of the dark."}, {"q": "Berry Gordy started Motown in Detroit in 1959 with a family loan of about how much?", "choices": ["$80", "$800", "$8,000", "$80,000"], "a": 1, "ex": "About $800, borrowed from his family's savings fund. Motown went on to launch the Supremes, the Temptations, Stevie Wonder, Marvin Gaye and the Jackson 5."}, {"q": "In 1991, which company became the first Black-controlled company listed on the New York Stock Exchange?", "choices": ["Motown Records", "Essence", "Johnson Publishing", "BET"], "a": 3, "ex": "BET, Black Entertainment Television. When Viacom bought it in 2001, founder Robert L. Johnson became the first Black American billionaire."}, {"q": "What was the first hip-hop album to win the Grammy for Album of the Year?", "choices": ["The Miseducation of Lauryn Hill", "OutKast's Speakerboxxx/The Love Below", "Kanye West's Late Registration", "Jay-Z's The Blueprint"], "a": 0, "ex": "The Miseducation of Lauryn Hill, in 1999. OutKast became the second in 2004. Hill won five Grammys that night, a record for a woman at the time."}, {"q": "Who was the first rapper to win the Pulitzer Prize for Music?", "choices": ["Jay-Z", "Kendrick Lamar", "J. Cole", "Missy Elliott"], "a": 1, "ex": "Kendrick Lamar, in 2018, for DAMN. It was the first time the prize went to a work that wasn't classical or jazz."}, {"q": "Who was the first Black person to EGOT, winning an Emmy, Grammy, Oscar and Tony?", "choices": ["John Legend", "Jennifer Hudson", "Viola Davis", "Whoopi Goldberg"], "a": 3, "ex": "Whoopi Goldberg, who completed it in 2002 with a Tony as a producer of Thoroughly Modern Millie. John Legend became the first Black man to EGOT in 2018. All four choices have done it."}, {"type": "tf", "q": "True or false: Sister Rosetta Tharpe, a Black gospel singer and guitarist, is called the godmother of rock and roll.", "a": 0, "ex": "True. Her electric guitar playing in the 1930s and '40s influenced Chuck Berry, Little Richard, Elvis Presley and Johnny Cash. The Rock & Roll Hall of Fame inducted her in 2018."}, {"q": "Which was the first Best Picture winner with an all-Black cast?", "choices": ["Black Panther", "Get Out", "Moonlight", "12 Years a Slave"], "a": 2, "ex": "Moonlight, in 2017. Three years earlier, 12 Years a Slave won, making Steve McQueen the first Black producer to win Best Picture."}, {"type": "tf", "q": "True or false: Josephine Baker is the first Black woman honored with burial rites in France's Panthéon.", "a": 0, "ex": "True. France gave her the honor in 2021. Beyond her stage career, she spied for the French Resistance during World War II."}, {"q": "On Living Single, who shared the women's apartment in the Brooklyn brownstone?", "choices": ["Khadijah, Max and Régine", "Khadijah, Synclaire and Régine", "Max, Synclaire and Régine", "Khadijah, Synclaire and Max"], "a": 1, "ex": "Khadijah, her cousin Synclaire and Régine. Max didn't live there, but she was always over, usually in their kitchen. Kyle and Overton had the other apartment in the building, and Régine moved out to live with her fiancé, Dexter, in the final season."}, {"type": "tf", "q": "True or false: Queen Latifah, who played Khadijah, also performed the Living Single theme song.", "a": 0, "ex": "True. She performed and is credited for the theme, \"We Are Living Single.\" The show premiered on Fox in 1993, a year before Friends, and the two have been compared ever since."}]},
  "culture-2":{added:"Nov 6", qs:[
    {q:"Black History Month grew out of Negro History Week, launched in February 1926 by which historian?", choices:["W.E.B. Du Bois","Carter G. Woodson","Arturo Schomburg","John Hope Franklin"], a:1, ex:"Carter G. Woodson launched Negro History Week in 1926. He timed it around the birthdays of Frederick Douglass and Abraham Lincoln."},
    {q:"Who became the first Black woman to win the Nobel Prize in Literature, in 1993?", choices:["Maya Angelou","Alice Walker","Gwendolyn Brooks","Toni Morrison"], a:3, ex:"Toni Morrison won the prize in 1993, the first Black woman writer to receive it."},
    {q:"Which 1959 play was the first by a Black woman to open on Broadway?", choices:["A Raisin in the Sun","The Amen Corner","Fences","The Piano Lesson"], a:0, ex:"Lorraine Hansberry's A Raisin in the Sun opened at the Ethel Barrymore Theatre on March 11, 1959."},
    {q:"The Jubilee Singers set out on tour in 1871 to raise money for which school?", choices:["Howard University","Tuskegee Institute","Fisk University","Morehouse College"], a:2, ex:"Fisk University in Nashville was in serious financial trouble. The singers' tour began in Cincinnati in October 1871 to raise funds for it."},
    {q:"Which was the first intercollegiate Greek-letter fraternity established for Black students, founded at Cornell in 1906?", choices:["Omega Psi Phi","Alpha Phi Alpha","Kappa Alpha Psi","Phi Beta Sigma"], a:1, ex:"Alpha Phi Alpha was founded at Cornell University in Ithaca, New York, on December 4, 1906."},
    {q:"The Gullah Geechee people, descendants of enslaved West and Central Africans, are rooted in which part of the U.S.?", choices:["The Mississippi Delta","The Texas Gulf Coast","The Chesapeake Bay","The Southeast coast, from North Carolina to Florida"], a:3, ex:"Their federal heritage corridor runs through coastal North Carolina, South Carolina, Georgia and Florida. Isolation on islands and coastal land helped them keep many African traditions and create the Gullah language."},
    {q:"Which Harlem Renaissance writer published \"The Negro Speaks of Rivers\" in The Crisis in 1921?", choices:["Claude McKay","Countee Cullen","Langston Hughes","Jean Toomer"], a:2, ex:"Langston Hughes's poem appeared in the June 1921 issue of The Crisis, the NAACP's magazine."},
    {type:"tf", q:"True or false: Revelations, Alvin Ailey's signature work, premiered in 1960.", a:0, ex:"True. It premiered in New York City on January 31, 1960, and remains the signature work of Alvin Ailey American Dance Theater."},
    {type:"tf", q:"True or false: Kente cloth originated with the Yoruba people of Nigeria.", a:1, ex:"False. Kente is a Ghanaian textile tied to Asante and Ewe weaving. Asante oral tradition places its origin in Bonwire, in Ghana's Ashanti Region."},
    {type:"tf", q:"True or false: Besides writing novels, Zora Neale Hurston studied anthropology at Barnard College.", a:0, ex:"True. She studied anthropology at Barnard with the scholar Franz Boas, and went on to collect Black folklore."}
  ]},
  "liberation-2":{added:"Nov 6", qs:[
    {q:"Who led the 1831 uprising of enslaved people in Southampton County, Virginia?", choices:["Denmark Vesey","Gabriel Prosser","Nat Turner","Toussaint Louverture"], a:2, ex:"Nat Turner's rebellion began on August 21, 1831. Southern states answered with harsher laws restricting enslaved and free Black people."},
    {q:"Africans who took over a schooner in 1839 won their freedom at the U.S. Supreme Court in 1841. What was the ship called?", choices:["Amistad","Clotilda","Creole","Henrietta Marie"], a:0, ex:"On March 9, 1841, the Court ruled that the Africans aboard the Amistad had been illegally enslaved and were free under American law."},
    {q:"Who organized the April 1960 student meeting at Shaw University that gave birth to SNCC?", choices:["Diane Nash","Septima Clark","Fannie Lou Hamer","Ella Baker"], a:3, ex:"Ella Baker brought sit-in students together in Raleigh, North Carolina, and the Student Nonviolent Coordinating Committee came out of that gathering."},
    {q:"Huey P. Newton co-founded the Black Panther Party in Oakland in 1966 with whom?", choices:["Stokely Carmichael","Bobby Seale","Fred Hampton","Eldridge Cleaver"], a:1, ex:"Newton and Bobby Seale founded the Black Panther Party for Self-Defense on October 15, 1966."},
    {q:"Who was the chief organizer of the 1963 March on Washington?", choices:["Roy Wilkins","James Farmer","Bayard Rustin","John Lewis"], a:2, ex:"Bayard Rustin ran the planning day to day. A. Philip Randolph was the march's director, with Rustin as his deputy."},
    {q:"The 1960 Greensboro sit-in at Woolworth's was started by four students from which school?", choices:["North Carolina A&T","Bennett College","Howard University","Shaw University"], a:0, ex:"On February 1, 1960, four North Carolina A&T students sat down at the whites-only lunch counter. Sit-ins soon spread across the South."},
    {q:"At age six, Ruby Bridges integrated which New Orleans school on November 14, 1960?", choices:["Central High School","Booker T. Washington Elementary","Dunbar Elementary","William Frantz Elementary"], a:3, ex:"November 14, 1960 was the court-ordered first day of integrated schools in New Orleans. Ruby became the first Black student at the previously all-white William Frantz Elementary."},
    {type:"tf", q:"True or false: The 13th Amendment banned slavery with no exceptions.", a:1, ex:"False. It bans slavery and involuntary servitude \"except as a punishment for crime\" after a conviction. That clause is still debated today."},
    {type:"tf", q:"True or false: Black soldiers made up roughly 10 percent of the Union Army in the Civil War.", a:0, ex:"True. The National Archives counts roughly 179,000 Black men who served as soldiers in the U.S. Army, about 10 percent of it."},
    {type:"tf", q:"True or false: President John F. Kennedy signed the Voting Rights Act of 1965.", a:1, ex:"False. President Lyndon Johnson signed it on August 6, 1965. Kennedy had been assassinated in 1963."}
  ]},
  "money-2":{added:"Nov 6", qs:[
    {q:"Which account can give you a tax break going in, while it grows, and coming out for qualified medical costs?", choices:["A regular savings account","A taxable brokerage account","A health savings account (HSA)","A traditional IRA"], a:2, ex:"That's the HSA's triple tax advantage. You must be on an HSA-eligible high-deductible health plan to contribute, and non-medical withdrawals before 65 generally owe income tax plus a 20% penalty."},
    {q:"Which category generally counts most in a FICO credit score?", choices:["Payment history","Credit mix","New credit","Length of credit history"], a:0, ex:"FICO's general breakdown gives payment history about 35%, with amounts owed next at about 30%. The weights can vary from person to person."},
    {q:"With a credit score of 580 or higher, what is the minimum down payment on an FHA loan?", choices:["0%","3.5%","10%","20%"], a:1, ex:"Scores from 500 to 579 need 10%. Lenders can set stricter requirements, and FHA loans also require mortgage insurance."},
    {q:"What is the defining feature of term life insurance?", choices:["It builds cash value you can borrow against","It only pays if you become disabled","It stays in force for life as long as premiums are paid","It covers you for a set period, like 10 or 20 years"], a:3, ex:"Term is lower-cost coverage for a set window. Some policies can renew at higher premiums, and some can't. Cash value policies like whole life are permanent."},
    {q:"What is \"heirs' property\"?", choices:["Land a bank holds until a loan is paid off","Land only the oldest child can inherit","Land passed down without clear title, co-owned by relatives","Family farmland that is exempt from property tax"], a:2, ex:"It often starts when someone dies without a will. The USDA has called it the leading cause of Black involuntary land loss, because one heir can force a court sale. Many states have adopted a law adding protections, so check yours."},
    {q:"The Freedman's Savings Bank, chartered by Congress in 1865, failed in what year?", choices:["1874","1881","1896","1907"], a:0, ex:"Its 1874 collapse cost tens of thousands of African American depositors some or all of their savings."},
    {q:"What was redlining?", choices:["Charging higher interest to anyone with bad credit","Denying mortgages and other financial services to neighborhoods because of the race of who lived there","Limiting how much a homeowner could borrow against a house","Taxing homes in Black neighborhoods at a higher federal rate"], a:1, ex:"It shut people out regardless of their own creditworthiness. The Fair Housing Act of 1968 barred racial discrimination in the sale, rental and financing of housing."},
    {type:"tf", q:"True or false: Checking your own credit lowers your score.", a:1, ex:"False. Checking your own credit is a soft inquiry and doesn't affect your scores. A hard inquiry, from applying for credit, can lower them a little."},
    {type:"tf", q:"True or false: A $1,000 tax credit generally saves you more than a $1,000 tax deduction.", a:0, ex:"True. A credit cuts the tax you owe directly, while a deduction lowers taxable income, so in the 22% bracket it saves about $220. A nonrefundable credit can only take your tax down to zero."},
    {type:"tf", q:"True or false: When a parent dies, adult children automatically have to pay the parent's credit card debts.", a:1, ex:"False. Debts are generally paid from the estate, and if it can't cover them they generally go unpaid. You can still owe if you co-signed or were a joint account owner, but not just for being an authorized user."}
  ]},
  "health-2":{added:"Nov 6", qs:[
    {q:"Black women are 2 to 3 times as likely as white women to develop which autoimmune disease?", choices:["Multiple sclerosis","Lupus","Type 1 diabetes","Celiac disease"], a:1, ex:"The CDC says Black and American Indian/Alaska Native women are 2 to 3 times more likely than white women to develop lupus, and they tend to have more severe cases."},
    {q:"In a major U.S. ultrasound study, about what share of Black women were estimated to have developed uterine fibroids by age 50?", choices:["About 25%","About 40%","About 60%","More than 80%"], a:3, ex:"The study estimated more than 80% for Black women and nearly 70% for white women. Heavy periods or pelvic pain are worth raising with a doctor."},
    {q:"At what age does the U.S. Preventive Services Task Force say average-risk adults should start colorectal cancer screening?", choices:["45","50","55","60"], a:0, ex:"People with higher risk, like a family history, may need to start earlier. Black adults have some of the highest colorectal cancer rates, so getting screened on time matters."},
    {q:"Which soul food side is a strong non-dairy source of calcium?", choices:["White rice","Candied yams","Collard greens","Potato salad"], a:2, ex:"A cooked cup of collards has roughly 300 mg of calcium, close to a glass of milk. That's useful if dairy bothers your stomach."},
    {q:"How does brown sugar compare with white sugar?", choices:["It has no effect on blood sugar","They're nearly the same nutritionally","It's a good source of vitamins","It has about half the calories"], a:1, ex:"Brown sugar is mostly white sugar with some molasses. The nutrition differences are negligible, and it affects blood sugar about the same."},
    {q:"Black Americans often test low for vitamin D. What have researchers found that makes this a puzzle?", choices:["They often have higher bone density and fewer fractures than white Americans with similar levels","They can't absorb vitamin D at all","Low levels in Black Americans never matter","Skin color fully explains the gap"], a:0, ex:"Experts call it the vitamin D paradox. Skin color plays a part but doesn't explain everything, so ask your doctor what level and dose make sense for you."},
    {q:"What does the Academy of Nutrition and Dietetics say about vegetarian and vegan diets?", choices:["They can't supply enough protein","They only work with protein powder","They're safe only for a few weeks","When appropriately planned, they can be nutritionally adequate"], a:3, ex:"Beans, lentils, tofu and nuts can carry the protein load. Planning matters, though: vegans need a reliable source of vitamin B-12, such as fortified foods or supplements."},
    {type:"tf", q:"True or false: Sea moss is natural, so you can't really take too much.", a:1, ex:"False. Sea moss is high in iodine, and too much can cause thyroid problems. It can also carry heavy metals, and labels aren't always accurate, so check with your doctor if you have thyroid disease or are pregnant."},
    {type:"tf", q:"True or false: Pulse oximeters can read blood oxygen higher than it really is in people with darker skin.", a:0, ex:"True. A 2022 study of about 7,000 COVID-19 patients found readings ran about 1.2% high on average for Black patients compared with white patients. If you're short of breath, get checked even if the number looks fine."},
    {type:"tf", q:"True or false: Sickle cell trait can make some A1C diabetes tests inaccurate.", a:0, ex:"True. It depends on the lab's test method, and with a suitable method A1C can be accurate. If you have the trait, tell your doctor so they can check."}
  ]},
  "spotlight-2":{added:"Nov 6", qs:[
    {q:"On A Different World, Whitley and Dwayne went to which fictional HBCU?", choices:["Mission College","Winslow University","Hillman College","Lincoln Heights College"], a:2, ex:"Hillman is a fictional historically Black college set in Virginia. Jasmine Guy played Whitley Gilbert and Kadeem Hardison played Dwayne Wayne."},
    {q:"Who played Aunt Viv first on The Fresh Prince of Bel-Air?", choices:["Janet Hubert","Daphne Maxwell Reid","Marla Gibbs","Phylicia Rashad"], a:0, ex:"Janet Hubert played her through the first three seasons. Daphne Maxwell Reid took over starting in Season 4."},
    {q:"On The Jeffersons, what kind of business did George Jefferson own?", choices:["Barbershops","Funeral homes","Record stores","Dry-cleaning stores"], a:3, ex:"George, played by Sherman Hemsley, built a chain of seven dry-cleaning stores in New York City."},
    {q:"The Notorious B.I.G.'s 1994 single \"Juicy\" samples which 1983 record?", choices:["\"Between the Sheets\" by The Isley Brothers","\"Juicy Fruit\" by Mtume","\"Outstanding\" by The Gap Band","\"Atomic Dog\" by George Clinton"], a:1, ex:"\"Juicy\" is built on a sample of Mtume's 1983 song \"Juicy Fruit.\" James Mtume was also a jazz percussionist who played with Miles Davis."},
    {q:"What year did Stevie Wonder's Songs in the Key of Life drop?", choices:["1972","1974","1976","1979"], a:2, ex:"It came out on September 28, 1976, and won Album of the Year at the 19th Grammy Awards."},
    {q:"Who has won more Tony Awards for performance than anyone in history?", choices:["Audra McDonald","Phylicia Rashad","Viola Davis","Leslie Odom Jr."], a:0, ex:"She has six competitive performance Tonys and is the only person to win in all four acting categories. Angela Lansbury and Julie Harris also have six, but each count includes a Special Tony."},
    {q:"Who was the first recipient of the Kennedy Center's Mark Twain Prize for American Humor, in 1998?", choices:["Whoopi Goldberg","Eddie Murphy","Dave Chappelle","Richard Pryor"], a:3, ex:"Richard Pryor received the first prize in 1998. Goldberg, Murphy and Chappelle were all honored in later years."},
    {type:"tf", q:"True or false: Family Matters was a spin-off of Perfect Strangers.", a:0, ex:"True. Harriette Winslow was the elevator operator at the Chicago Chronicle on Perfect Strangers before Family Matters gave her character her own show."},
    {type:"tf", q:"True or false: Aretha Franklin was the first to record and release \"Respect.\"", a:1, ex:"False. Otis Redding released it in 1965. Aretha's version came out in 1967."},
    {type:"tf", q:"True or false: Through the 2026 ceremony, Beyoncé has won more Grammys than anyone in history.", a:0, ex:"True. She has 35 wins, and conductor Georg Solti is next with 31. Counts can change with each new ceremony."}
  ]},
};

// Weekly sets. Set 1 of each topic uses the topic name as its id ("culture"), so old links keep working.
// To add a new set, add an entry named topic-N, for example
//   "culture-2":{added:"Nov 7", qs:[ ...questions... ]},
// It inherits the title, color, description and note from set 1 and shows up first on the home page.
const TOPICS=["culture","liberation","money","health","spotlight"];
Object.entries(QUIZZES).forEach(([id,q])=>{const m=id.match(/^(.+)-(\d+)$/);q.topic=m?m[1]:id;q.set=m?+m[2]:1;
  if(q.set>1){const base=QUIZZES[q.topic];["title","kicker","color","dek","note"].forEach(k=>{if(q[k]==null)q[k]=base[k]})}});
["culture","liberation","money"].forEach(t=>{QUIZZES[t].added=QUIZZES[t].added||"Oct 30"});QUIZZES.health.added=QUIZZES.health.added||"Oct 31";
function setsFor(t){return Object.entries(QUIZZES).filter(([,q])=>q.topic===t).sort((a,b)=>b[1].set-a[1].set)}
function setLabel(qz){return setsFor(qz.topic).length>1?` · Set ${qz.set}`:""}

// Score titles per topic, from a perfect score down: [title, line]
const RANKS = {
  culture:[
    ["Cookout Royalty","Perfect score. You get a plate to take home, and nobody's checking your potato salad."],
    ["Spades Partner Material","You know the culture. Uncles are fighting over who gets to team up with you."],
    ["Invited, With Conditions","You can come to the cookout, but you're on ice duty until you run it back."],
    ["Bring the Paper Plates","Auntie said sit down and listen. Take it again and earn a real dish."]
  ],
  liberation:[
    ["Freedom School Valedictorian","Perfect score. Ida B. Wells would have put you on the masthead."],
    ["Front of the March","You did the reading. Organizers would hand you the clipboard."],
    ["Still on the Bridge","You've made it partway across. The rest of the march is one retake away."],
    ["The Struggle Continues","So does your studying. Run it back and walk out of here a historian."]
  ],
  money:[
    ["Black Wall Street Banker","Perfect score. Maggie Lena Walker would hand you a charter."],
    ["Fully Vested","Your money knowledge is compounding nicely. Keep stacking."],
    ["Getting the Match","You're collecting the free money, just not maxing out yet. One more round."],
    ["Overdraft Alert","Your knowledge is sitting in a 0.01% savings account. Time to move it."]
  ],
  spotlight:[["Headlining the Apollo", "Perfect score. You're closing the show, and the whole theater is on its feet."], ["Liner Notes Memorized", "You know who did it first. Keep that crate digging going."], ["Backup Singer", "You know the hook, not every verse. Run it back."], ["Booed at Amateur Night", "The Sandman is walking you off the stage. Take it again."]],
  health:[["The Family Doctor (Unofficial)", "Perfect score. The whole family is calling you before they call the doctor."], ["Label Reader", "You check what's in it before it goes in you. Keep it up."], ["Greens, Hold the Ham Hock", "You're making better choices. One more round gets you the rest of the way."], ["Auntie's Group Chat", "You've been getting health facts from forwarded messages. Run it back."]]
};
function rankFor(id,score,n){const r=RANKS[QUIZZES[id].topic];const p=score/n;return score===n?r[0]:p>=.7?r[1]:p>=.4?r[2]:r[3]}
const app=document.getElementById("app");
const BASE="https://jamagarr1.github.io/roots-and-wealth/";
function linkFor(id){return id?BASE+"#"+id:BASE}
function shareRow(text,label,id){
  const row=el("div","row"); const b=el("button","btn ghost",label); b.id=id;
  const msg=el("span","copied"); msg.hidden=true;
  b.onclick=()=>{const done=()=>{msg.textContent="Copied. Paste it into a text.";msg.hidden=false};
    const fail=()=>{msg.textContent=text;msg.hidden=false};
    try{navigator.clipboard.writeText(text).then(done,fail)}catch(e){fail()}};
  row.append(b,msg); return row;
}
const BEST_KEY="rw-best";
function getBest(){try{return JSON.parse(localStorage.getItem(BEST_KEY))||{}}catch(e){return {}}}
function setBest(id,s){try{const b=getBest();if(!b[id]||s>b[id]){b[id]=s;localStorage.setItem(BEST_KEY,JSON.stringify(b))}}catch(e){}}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function setAccent(v){document.documentElement.style.setProperty("--accent",v?`var(${v})`:"var(--red)")}

function home(){
  setAccent(null); app.innerHTML="";
  const h=el("header");
  h.innerHTML=`<div class="stripe"><i></i><i></i><i></i></div><h1>Roots, Health &amp; Wealth</h1>`;
  h.appendChild(el("p","dek","Five quizzes on Black culture, liberation, money, health and entertainment. Pick one, answer as you go, and send a quiz to a friend to see who scores higher."));
  app.appendChild(h);
  const tiles=el("div","tiles"); const best=getBest();
  TOPICS.forEach(t=>{
    const sets=setsFor(t); const [id,qz]=sets[0];
    const wrap=el("div","topic");
    const a=el("a","tile"); a.href="#"+id; a.style.setProperty("--c",`var(${qz.color})`);
    a.appendChild(el("h2",null,qz.title)); a.appendChild(el("p",null,qz.dek));
    a.appendChild(el("span","count",(sets.length>1?`Set ${qz.set} · `:"")+(best[id]!=null?`Best ${best[id]}/${qz.qs.length}`:`${qz.qs.length} questions`)));
    wrap.appendChild(a);
    if(sets.length>1){
      const older=el("div","older"); older.appendChild(el("span",null,"Earlier sets:"));
      sets.slice(1).forEach(([oid,oq])=>{const l=el("a","chip",`Set ${oq.set} · ${oq.added}`+(best[oid]!=null?` · ${best[oid]}/${oq.qs.length}`:"")); l.href="#"+oid; older.appendChild(l)});
      wrap.appendChild(older);
    }
    tiles.appendChild(wrap);
  });
  app.appendChild(tiles);
  app.appendChild(shareRow(`Test what you know about Black culture, liberation, money, health and entertainment. Five quick quizzes: ${linkFor()}`,"Copy link to text a friend","share-home"));
}

function runQuiz(id){
  const qz=QUIZZES[id]; setAccent(qz.color);
  let i=0,score=0,results=[];
  app.innerHTML="";
  const back=el("a","back","← All quizzes"); back.href="#";
  const h=el("header"); h.appendChild(el("div","kicker",qz.kicker+setLabel(qz))); h.appendChild(el("h1",null,qz.title)); h.appendChild(el("p","dek",qz.dek));
  const prog=el("div","progress"); prog.setAttribute("aria-hidden","true");
  const stage=el("main"); stage.setAttribute("aria-live","polite");
  app.append(back,h,shareRow(`Try the "${qz.title}" quiz on ${qz.kicker.toLowerCase()}${setLabel(qz)}: ${linkFor(id)}`,"Copy quiz link",id+"-share"),prog,stage);
  if(qz.note) app.appendChild(el("p","note",qz.note));

  function drawProgress(){prog.innerHTML="";qz.qs.forEach((_,k)=>{const s=el("span");if(results[k]===true)s.className="right";else if(results[k]===false)s.className="wrong";else if(k===i)s.className="now";prog.appendChild(s)})}
  function render(){
    drawProgress(); if(i>=qz.qs.length) return finish();
    const item=qz.qs[i], choices=item.type==="tf"?["True","False"]:item.choices;
    stage.innerHTML="";
    const card=el("section","card"); card.appendChild(el("div","qnum",`Question ${i+1} of ${qz.qs.length}`)); card.appendChild(el("h2","q",item.q));
    const box=el("div","choices"+(item.type==="tf"?" tf":""));
    choices.forEach((c,k)=>{const b=el("button","choice",c);b.id=`${id}-q${i}-c${k}`;b.onclick=()=>answer(k,box,card,item);box.appendChild(b)});
    card.appendChild(box); stage.appendChild(card);
  }
  function answer(k,box,card,item){
    const right=k===item.a; if(right)score++; results[i]=right;
    [...box.children].forEach((b,n)=>{b.disabled=true;if(n===item.a)b.classList.add("correct");else if(n===k)b.classList.add("picked-wrong");else b.classList.add("dim")});
    const r=el("div","reveal"); r.appendChild(el("div","verdict "+(right?"ok":"no"),right?"Correct.":"Not quite.")); r.appendChild(el("p","explain",item.ex));
    const next=el("button","btn",i===qz.qs.length-1?"See your score":"Next question"); next.id=`${id}-next${i}`;
    next.onclick=()=>{i++;render();window.scrollTo({top:0,behavior:"smooth"})};
    r.appendChild(next); card.appendChild(r); drawProgress(); next.focus({preventScroll:true});
  }
  function finish(){
    setBest(id,score); const n=qz.qs.length; const [rank,line]=rankFor(id,score,n);
    stage.innerHTML="";
    const card=el("section","card"); card.appendChild(el("div","qnum","Your score"));
    const s=el("div","score"); s.innerHTML=`${score}<small> / ${n}</small>`; card.appendChild(s);
    card.appendChild(el("div","rank",rank));
    card.appendChild(el("p","explain",line));
    const row=el("div","row");
    const again=el("button","btn","Take it again"); again.id=id+"-again"; again.onclick=()=>{i=0;score=0;results=[];render()};
    const brag=el("button","btn ghost","Copy my score"); brag.id=id+"-copy";
    const ok=el("span","copied"); ok.hidden=true;
    brag.onclick=()=>{const t=`I got ${score}/${n} on the "${qz.title}" quiz${setLabel(qz)} and earned the title "${rank}." Think you can beat me? ${linkFor(id)}`;
      const done=()=>{ok.textContent="Copied. Paste it into a text.";ok.hidden=false};
      try{navigator.clipboard.writeText(t).then(done,()=>{ok.textContent=t;ok.hidden=false})}catch(e){ok.textContent=t;ok.hidden=false}};
    const more=el("a","btn ghost","Other quizzes"); more.href="#";
    row.append(again,brag,more);
    setsFor(qz.topic).filter(([o])=>o!==id).forEach(([o,oq])=>{const l=el("a","btn ghost",`Play Set ${oq.set}`); l.href="#"+o; row.appendChild(l)});
    row.appendChild(ok); card.appendChild(row); stage.appendChild(card);
  }
  render();
}

function route(){const id=location.hash.replace("#","");if(QUIZZES[id])runQuiz(id);else home();window.scrollTo(0,0)}
window.addEventListener("hashchange",route); route();
</script>
